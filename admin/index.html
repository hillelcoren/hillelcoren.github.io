<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/admin/b/b5cf2ece2555/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Invoice Ninja — admin client.">

  <!-- Open Graph / social-share preview. Deliberately the MASKABLE icon: it's
       the only opaque 512 we ship, and a share card composites a transparent
       PNG onto its own background — on a dark card that would put a black disc
       on near-black. Icon-512.png stays transparent for the PWA install. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Invoice Ninja">
  <meta property="og:title" content="Invoice Ninja">
  <meta property="og:description" content="Invoice Ninja — admin client.">
  <meta property="og:url" content="https://invoiceninja.com">
  <meta property="og:image" content="https://hillelcoren.github.io/admin/icons/Icon-maskable-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Invoice Ninja">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Invoice Ninja">
  <meta name="twitter:description" content="Invoice Ninja — admin client.">
  <meta name="twitter:image" content="https://hillelcoren.github.io/admin/icons/Icon-maskable-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Invoice Ninja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Installed-window title bar / Android status bar. manifest.json can only
       carry one theme_color, so these override it per system theme with the
       design system's own bg / deep ink (lib/app/design_tokens.dart). The
       running app then sets them to the user's own theme
       (applyBrowserChromeColor, docs/web-platform-differences.md). -->
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)">

  <title>Invoice Ninja</title>
  <link rel="manifest" href="manifest.json">

  <!-- glue:start loader-style (shared with tools/web_deploy/boot_page.html) -->
  <style>
    /* Boot loader shown until Flutter paints its first frame. Ported from
       admin-portal/web/index.html — three-dot spinner from
       https://projects.lukehaas.me/css-loaders/ */
    /* The app's default background and ink (lightSand / darkEspresso in
       lib/app/design_tokens.dart), so the boot matches the first frame and a
       browser that tints its toolbar from the page (Safari) gets the app's
       colour, not grey. Once running, the app sets both itself to whatever
       theme the user picked (applyBrowserChromeColor). */
    html, body { margin: 0; background-color: #F6F4EF; color: #1A1814; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #15140F; color: #F6F4EF; }
    }
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader,
    .loader:before,
    .loader:after {
      border-radius: 50%;
      width: 2.5em;
      height: 2.5em;
      -webkit-animation-fill-mode: both;
      animation-fill-mode: both;
      -webkit-animation: load7 1.8s infinite ease-in-out;
      animation: load7 1.8s infinite ease-in-out;
    }
    .loader {
      color: #857F73;
      font-size: 10px;
      position: relative;
      text-indent: -9999em;
      -webkit-transform: translateZ(0);
      -ms-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-animation-delay: -0.40s;
      animation-delay: -0.40s;
    }
    .loader:before,
    .loader:after {
      content: '';
      position: absolute;
      top: 0;
    }
    .loader:before {
      left: -3.5em;
      -webkit-animation-delay: -0.80s;
      animation-delay: -0.80s;
    }
    .loader:after {
      left: 3.5em;
    }
    @-webkit-keyframes load7 {
      0%, 80%, 100% { box-shadow: 0 2.5em 0 -1.3em; }
      40% { box-shadow: 0 2.5em 0 0; }
    }
    @keyframes load7 {
      0%, 80%, 100% { box-shadow: 0 2.5em 0 -1.3em; }
      40% { box-shadow: 0 2.5em 0 0; }
    }
  </style>
  <!-- glue:end -->

  <!-- pdf.js (PDF preview on the web) loads from our own origin, not unpkg.
       `printing` reads this before its dynamic import; resolving against the
       base URI keeps a non-root `--base-href` (the demo's /admin/) working.
       The vendored files must match printing's pinned pdf.js version —
       test/lint/vendored_pdfjs_version_test.dart. -->
  <!-- glue:start pdfjs -->
  <script>
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;
  </script>
  <!-- glue:end -->
</head>
<body>
  <!-- Boot loader — removed once Flutter renders (see script below). -->
  <!-- glue:start loader -->
  <div id="loader"><div class="loader"></div></div>
  <!-- glue:end -->

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=032b1e342b32" async></script>
  <!-- glue:start first-frame -->
  <script>
    (function () {
      // Drop the boot loader once Flutter paints its first frame. The loader
      // carries no z-index, so Flutter's view already covers it before this
      // fires — this just cleans the node out of the DOM.
      var painted = false;
      // flutter_bootstrap.js reads this key: 'canvaskit' forces the
      // JavaScript build (docs/web-platform-differences.md).
      var RENDERER_KEY = 'invoiceninja.web.renderer.v1';
      var pinnedByWatchdog = false;
      // The fallback holds for this deploy only, the same tag
      // flutter_bootstrap.js (inBuildTag) checks before honouring it.
      function watchdogTag() {
        var s = document.querySelector('script[src*="flutter_bootstrap.js"]');
        return 'watchdog ' + (s ? s.src : '') + ' ' + document.baseURI;
      }
      window.addEventListener('flutter-first-frame', function () {
        painted = true;
        // Read by Deploy to Web's boot smoke (docs/web-deploy.md).
        window.__flutterFirstFrame = true;
        // A slow boot that painted after all was not a WebAssembly crash.
        if (pinnedByWatchdog) {
          try {
            if (localStorage.getItem(RENDERER_KEY) === watchdogTag()) {
              localStorage.removeItem(RENDERER_KEY);
            }
          } catch (e) {}
        }
        var el = document.getElementById('loader');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      });
      // Whether this boot loaded the WebAssembly build (dart2wasm's
      // main.dart.wasm / main.dart.mjs) rather than main.dart.js.
      function bootIsWasm() {
        try {
          return performance.getEntriesByType('resource').some(function (r) {
            return /\/main\.dart\.(wasm|mjs)(\?|$)/.test(r.name);
          });
        } catch (e) {
          return false;
        }
      }
      // Safety-net: boot must never leave the user on an endless spinner. If
      // the first frame hasn't painted after 30s the boot is wedged — most
      // likely a transient web-database lock left by a service-worker reload
      // after a redeploy (see lib/data/db/database_opener_web.dart, which now
      // time-bounds WasmDatabase.open). Swap the spinner for a one-tap reload,
      // which clears the stale lock. On a WebAssembly boot it may instead be
      // a browser that passed the loader's checks and crashed, so the reload
      // (or any later load) uses the JavaScript build; ?renderer=auto undoes it.
      window.setTimeout(function () {
        if (painted) return;
        if (bootIsWasm()) {
          try {
            localStorage.setItem(RENDERER_KEY, watchdogTag());
            pinnedByWatchdog = true;
          } catch (e) {}
        }
        var el = document.getElementById('loader');
        if (!el) return;
        el.innerHTML =
          '<div style="font-family:system-ui,-apple-system,sans-serif;color:inherit;' +
          'text-align:center;max-width:320px;padding:24px;line-height:1.5">' +
          '<div style="margin-bottom:16px">This is taking longer than expected.</div>' +
          '<button onclick="window.location.reload()" ' +
          'style="font:inherit;color:#1f2937;background:#fff;border:1px solid #d6d1c6;' +
          'border-radius:6px;padding:8px 22px;cursor:pointer">Reload</button>' +
          '</div>';
      }, 30000);
    })();
  </script>
  <!-- glue:end -->
</body>
</html>
